name: Documentation and commit checks
on:
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate documentation and examples
        run: python scripts/verify_docs.py
      - name: Install pinned backend tooling
        run: python -m pip install uv==0.13.0
      - name: Sync locked backend dependencies
        run: uv sync --locked
      - name: Validate backend contracts
        run: uv run --locked python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Validate PR commits
        env:
          C4_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/verify_commits.py --base "$C4_BASE_SHA"

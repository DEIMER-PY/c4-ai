name: Documentation and commit checks
on:
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate documentation and examples
        run: python scripts/verify_docs.py
      - name: Install pinned backend tooling
        run: python -m pip install uv==0.13.0
      - name: Sync locked backend dependencies
        run: uv sync --locked
      - name: Validate backend contracts
        run: uv run --locked python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Validate PR commits
        env:
          C4_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/verify_commits.py --base "$C4_BASE_SHA"
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.7
      - name: Install locked dashboard dependencies
        run: pnpm install --frozen-lockfile
      - name: Test dashboard and HTTP adapter
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build explicit demo mode (CI has no local API)
        env:
          C4_DATA_MODE: demo
        run: pnpm build
  video:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/demo-video
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.34.7
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
  showcase:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-video
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: node node_modules/eslint/bin/eslint.js src/C4Launch.tsx src/launch-index.tsx src/film src/film-index.tsx

<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C4 AI · Revisión de entrega</title>
<style>body{margin:0;background:#0c101c;color:#edf1fc;font:16px system-ui}main{max-width:1200px;margin:40px auto;padding:24px}h1{font-size:clamp(28px,4vw,52px)}p{color:#b6c0d8;line-height:1.6}video{width:100%;margin:24px 0;border:1px solid #444b63;border-radius:18px;background:#000}nav{display:flex;gap:12px;flex-wrap:wrap}button{border:1px solid #756394;background:#25203a;color:#eee4ff;border-radius:10px;padding:12px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #5ee3e8;outline-offset:4px}label{display:grid;gap:12px}output{display:block;margin-top:20px}</style>
<main><p>C4 AI / ENTREGA S1</p><h1>Una corrección necesita evidencia.</h1><p>Selecciona el nuevo MP4 exportado desde Remotion. Se reproduce en tu computador: este visor no lo sube a ningún servicio.</p><label>Archivo de video<input id="file" type="file" accept="video/mp4"></label><video id="video" controls preload="metadata" aria-label="Video de entrega C4 AI"></video><nav aria-label="Capítulos"><button data-time="0">00:00 Problema</button><button data-time="14">00:14 Arquitectura</button><button data-time="30">00:30 CLI</button><button data-time="48">00:48 Dashboard</button><button data-time="66">01:06 Aceptación</button><button data-time="85">01:25 Rechazo</button><button data-time="103">01:43 Hermes</button></nav><output id="status" role="status">Pendiente de seleccionar video. Capítulos de C4S1Delivery (120 segundos).</output></main>
<script>const video=document.getElementById('video'),file=document.getElementById('file'),status=document.getElementById('status');let url;file.addEventListener('change',()=>{if(!file.files[0])return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(file.files[0]);video.src=url;status.textContent='Archivo seleccionado: '+file.files[0].name});document.querySelectorAll('[data-time]').forEach(button=>button.addEventListener('click',()=>{if(!video.src){status.textContent='Selecciona primero el MP4.';return}video.currentTime=Number(button.dataset.time);video.play().catch(()=>{status.textContent='Pulsa reproducir para continuar.'})}));</script></html>

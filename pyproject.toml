[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "c4-ai"
version = "0.1.0"
description = "CLI and typed contracts for the C4 AI reliability workflow"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "prompt-toolkit==3.0.53",
    "pydantic==2.13.5",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[tool.setuptools.packages.find]
include = ["c4*"]

[project.scripts]
c4 = "c4.cli:app"

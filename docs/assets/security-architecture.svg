<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="sec-title sec-desc"><title id="sec-title">Arquitectura de Seguridad y Defensa en Profundidad de C4 AI</title><desc id="sec-desc">Cuatro capas concéntricas de seguridad: Perímetro, Sanitización PII y Anti-Inyecciones, Gate Determinista Inmutable y Cadena de Custodia Criptográfica.</desc><defs><marker id="sec-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6F95C9"/></marker><linearGradient id="grad-gate" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#10372F"/><stop offset="100%" stop-color="#1B4D3E"/></linearGradient><linearGradient id="grad-audit" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2D1B4E"/><stop offset="100%" stop-color="#1B244A"/></linearGradient></defs><rect width="1200" height="940" rx="20" fill="#0B1425"/><text x="46" y="57" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#F0F5FF">Seguridad y Defensa en Profundidad — C4 AI</text><text x="46" y="90" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#A5B8D3">Arquitectura Enterprise • 4 Capas Concéntricas de Blindaje Defensivo para Agentes Autónomos</text><rect x="46" y="125" width="530" height="150" rx="16" fill="#142239" stroke="#2B3E5D"/><text x="67" y="158" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#7EBCFA">CAPA 1: PERÍMETRO Y CONTROL DE ACCESO</text><text x="67" y="186" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#C4D0E4">• Cifrado estricto en tránsito TLS 1.3 hacia Gateways (Grok 4.7 / Groq)</text><text x="67" y="210" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#C4D0E4">• Protección anti-SSRF: adaptadores locales aislados a localhost / 127.0.0.1</text><text x="67" y="234" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#C4D0E4">• PrivateHistory: credenciales excluidas del historial del CLI y telemetría</text><rect x="624" y="125" width="530" height="150" rx="16" fill="#142239" stroke="#2B3E5D"/><text x="645" y="158" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#E879F9">CAPA 2: SANITIZACIÓN Y ANTI-INYECCIÓN</text><text x="645" y="186" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#C4D0E4">• Filtro perimetral OWASP LLM-01 frente a inyecciones directas e indirectas</text><text x="645" y="210" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#C4D0E4">• Enmascaramiento PII sintético (PCI DSS / GDPR) antes de inferencia</text><text x="645" y="234" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#C4D0E4">• Separación estricta de instrucciones del sistema e inputs de usuario</text><path d="M311 275 V315" fill="none" stroke="#6F95C9" stroke-width="2.5" marker-end="url(#sec-arrow)"/><path d="M889 275 V315" fill="none" stroke="#6F95C9" stroke-width="2.5" marker-end="url(#sec-arrow)"/><rect x="46" y="315" width="1108" height="235" rx="16" fill="url(#grad-gate)" stroke="#3AA98B" stroke-width="1.5"/><text x="76" y="355" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#96F1D5">CAPA 3: EL GATE DETERMINISTA INMUTABLE (NÚCLEO)</text><text x="76" y="385" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#CDECE2">Garantía de confiabilidad: ningún candidato es promovido a producción sin superar la evaluación formal.</text><rect x="76" y="405" width="310" height="115" rx="12" fill="#0E2D27" stroke="#28735F"/><text x="96" y="435" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#96F1D5">Línea Base Inmutable</text><text x="96" y="460" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#A7D7C9">• Dataset de prueba sellado SHA-256</text><text x="96" y="482" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#A7D7C9">• Ejecución idéntica en paralelo</text><text x="96" y="504" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#A7D7C9">• Prohibición de sobreescritura</text><rect x="445" y="405" width="310" height="115" rx="12" fill="#0E2D27" stroke="#28735F"/><text x="465" y="435" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#96F1D5">Regla Cero Regresiones</text><text x="465" y="460" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#A7D7C9">• Mejora verificada en caso objetivo</text><text x="465" y="482" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#A7D7C9">• 0 casos degradados en el resto</text><text x="465" y="504" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#A7D7C9">• 100% controles obligatorios OK</text><rect x="814" y="405" width="310" height="115" rx="12" fill="#0E2D27" stroke="#28735F"/><text x="834" y="435" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#96F1D5">Veredictos Seguros</text><text x="834" y="460" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#A7D7C9">• ACCEPTED (Listo para merge)</text><text x="834" y="482" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#A7D7C9">• REJECTED (Bloqueo automático)</text><text x="834" y="504" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#A7D7C9">• NEEDS_HUMAN_REVIEW (Escalado)</text><path d="M600 550 V585" fill="none" stroke="#6F95C9" stroke-width="2.5" marker-end="url(#sec-arrow)"/><rect x="46" y="585" width="1108" height="235" rx="16" fill="url(#grad-audit)" stroke="#8B5CF6" stroke-width="1.5"/><text x="76" y="625" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#DDD6FE">CAPA 4: AUDITORÍA CRIPTOGRÁFICA Y CADENA DE CUSTODIA</text><text x="76" y="655" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#C4B5FD">No repudiación forense para auditorías SOC 2 Tipo II y Ley de IA de la Unión Europea (EU AI Act).</text><rect x="76" y="675" width="310" height="115" rx="12" fill="#1C1838" stroke="#4C1D95"/><text x="96" y="705" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#DDD6FE">AuditLogEntry</text><text x="96" y="730" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#C4B5FD">• Timestamp UTC con microsegundos</text><text x="96" y="752" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#C4B5FD">• Actor, acción y hash SHA-256</text><text x="96" y="774" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#C4B5FD">• Firma criptográfica HMAC</text><rect x="445" y="675" width="310" height="115" rx="12" fill="#1C1838" stroke="#4C1D95"/><text x="465" y="705" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#DDD6FE">IntegrityProof (Merkle)</text><text x="465" y="730" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#C4B5FD">• Hash de Dataset de prueba</text><text x="465" y="752" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#C4B5FD">• Hash de Prompts (Base + Patch)</text><text x="465" y="774" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#C4B5FD">• Merkle Root inalterable</text><rect x="814" y="675" width="310" height="115" rx="12" fill="#1C1838" stroke="#4C1D95"/><text x="834" y="705" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#DDD6FE">Gobernanza EU AI Act</text><text x="834" y="730" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#C4B5FD">• Art. 9: Gestión continua de riesgo</text><text x="834" y="752" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#C4B5FD">• Art. 12: Registro automático de logs</text><text x="834" y="774" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#C4B5FD">• Art. 14: Supervisión humana activa</text><rect x="46" y="850" width="1108" height="54" rx="12" fill="#13233B" stroke="#2D486D"/><text x="66" y="883" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#D8E8FA">Seguridad Enterprise • OWASP LLM Top 10 • EU AI Act (Art. 9-15) • SOC 2 Tipo II • Sin acciones destructivas en producción</text></svg>
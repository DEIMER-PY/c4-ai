<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160" fill="none" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">C4 AI — Autonomous Agent Reliability</title>
  <desc id="logo-desc">Modern vector logo for C4 AI featuring a cybernetic neural core and clean typography.</desc>
  <defs>
    <linearGradient id="c4-grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="c4-grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="c4-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Modern Vector Emblem -->
  <g transform="translate(30, 20)">
    <!-- Outer Glow Shield -->
    <polygon points="60,5 115,35 115,90 60,118 5,90 5,35" fill="#0d1117" stroke="url(#c4-grad-cyan)" stroke-width="2.5" filter="url(#c4-glow)" />
    
    <!-- Inner Cybernetic Lines -->
    <path d="M60,15 L105,40 L105,85 L60,108 L15,85 L15,40 Z" stroke="#1e293b" stroke-width="1.5" />
    <path d="M60,25 L60,100" stroke="url(#c4-grad-cyan)" stroke-width="2" stroke-linecap="round" />
    <path d="M25,50 L95,75" stroke="url(#c4-grad-purple)" stroke-width="2" stroke-linecap="round" />
    <path d="M25,75 L95,50" stroke="url(#c4-grad-purple)" stroke-width="2" stroke-linecap="round" />
    
    <!-- Central Neuron Node -->
    <circle cx="60" cy="62" r="14" fill="#090d16" stroke="url(#c4-grad-cyan)" stroke-width="3" />
    <circle cx="60" cy="62" r="6" fill="#00f0ff" />
    
    <!-- Orbiting Satellite Nodes -->
    <circle cx="60" cy="25" r="4" fill="#38bdf8" />
    <circle cx="95" cy="50" r="4" fill="#c084fc" />
    <circle cx="95" cy="75" r="4" fill="#f43f5e" />
    <circle cx="60" cy="100" r="4" fill="#38bdf8" />
    <circle cx="25" cy="75" r="4" fill="#c084fc" />
    <circle cx="25" cy="50" r="4" fill="#f43f5e" />
  </g>

  <!-- Wordmark Typography -->
  <g transform="translate(180, 42)">
    <!-- Main C4 AI Title -->
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="56" font-weight="900" fill="#f8fafc" letter-spacing="-1.5">
      C4 <tspan fill="url(#c4-grad-cyan)">AI</tspan>
    </text>
    
    <!-- Tagline Subtitle -->
    <text x="2" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="3.5">
      AGENT RELIABILITY ENGINEERING
    </text>

    <!-- Status Pill Badge -->
    <g transform="translate(240, 24)">
      <rect x="0" y="0" width="135" height="24" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="1.2" />
      <circle cx="12" cy="12" r="4" fill="#10b981" />
      <text x="24" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">ZERO REGRESSION</text>
    </g>
  </g>
</svg>

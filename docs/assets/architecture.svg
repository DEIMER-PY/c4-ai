<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc"><title id="title">Arquitectura planificada de C4 AI</title><desc id="desc">Dashboard y CLI usan servicios compartidos. Workflow de seis módulos, herramientas controladas, gateway Grok y persistencia PostgreSQL/Redis. Gate exige evidencia antes de aceptar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6F95C9"/></marker></defs><rect width="1200" height="940" rx="20" fill="#0B1425"/><text x="46" y="57" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#F0F5FF">Arquitectura de C4 AI</text><text x="46" y="90" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#A5B8D3">Diseño planificado • API y CLI comparten el mismo núcleo</text><rect x="46" y="125" width="330" height="87" rx="16" fill="#142239" stroke="#2B3E5D"/><text x="67" y="158" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#E8F2FF">Dashboard</text><text x="67" y="186" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#C4D0E4">Next.js / TypeScript</text><rect x="416" y="125" width="330" height="87" rx="16" fill="#142239" stroke="#2B3E5D"/><text x="437" y="158" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#E8F2FF">CLI</text><text x="437" y="186" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#C4D0E4">Typer / Rich</text><rect x="836" y="125" width="318" height="87" rx="16" fill="#163044" stroke="#30757D"/><text x="857" y="158" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#91E5E4">Gateway Grok</text><text x="857" y="186" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#C4D0E4">URL, modelo y clave configurables</text><rect x="46" y="259" width="700" height="87" rx="16" fill="#173053" stroke="#42648F"/><text x="67" y="292" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#EDF5FF">API y servicios del núcleo</text><text x="67" y="320" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#C4D0E4">FastAPI / Pydantic • negocio compartido • contratos v1</text><path d="M211 212 V259" fill="none" stroke="#6F95C9" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M581 212 V259" fill="none" stroke="#6F95C9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="836" y="259" width="318" height="87" rx="16" fill="#142239" stroke="#2B3E5D"/><text x="857" y="292" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#E8F2FF">PostgreSQL / JSONB</text><text x="857" y="320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#C4D0E4">Incidentes, versiones y evidencia</text><path d="M746 302 H836" fill="none" stroke="#6F95C9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="836" y="381" width="318" height="87" rx="16" fill="#142239" stroke="#2B3E5D"/><text x="857" y="414" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#E8F2FF">Redis / RQ</text><text x="857" y="442" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#C4D0E4">Cola de trabajos y workers</text><path d="M746 326 H791 V424 H836" fill="none" stroke="#6F95C9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="46" y="381" width="700" height="425" rx="20" fill="#101F35" stroke="#34516F"/><text x="67" y="415" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#7EBCFA">WORKFLOW DE INCIDENTES</text><rect x="68" y="444" width="194" height="91" rx="12" fill="#1A2C45" stroke="#3C587B"/><text x="82" y="479" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#E8F1FF">Inspector</text><text x="82" y="508" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#C4D0E4">Detecta y clasifica</text><rect x="298" y="444" width="194" height="91" rx="12" fill="#1A2C45" stroke="#3C587B"/><text x="312" y="479" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#E8F1FF">Diagnoser</text><text x="312" y="508" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#C4D0E4">Explica causa probable</text><rect x="528" y="444" width="194" height="91" rx="12" fill="#1A2C45" stroke="#3C587B"/><text x="542" y="479" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#E8F1FF">Security Sentinel</text><text x="542" y="508" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#C4D0E4">Revisa políticas y riesgos</text><rect x="68" y="579" width="194" height="91" rx="12" fill="#1A2C45" stroke="#3C587B"/><text x="82" y="614" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#E8F1FF">Patcher</text><text x="82" y="643" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#C4D0E4">Crea prompt / config</text><rect x="298" y="579" width="194" height="91" rx="12" fill="#1A2C45" stroke="#3C587B"/><text x="312" y="614" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#E8F1FF">Evaluator</text><text x="312" y="643" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#C4D0E4">Compara y detecta regresión</text><rect x="528" y="579" width="194" height="91" rx="12" fill="#1A2C45" stroke="#3C587B"/><text x="542" y="614" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#E8F1FF">Reporter</text><text x="542" y="643" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#C4D0E4">Resume evidencia</text><path d="M396 346 V381" fill="none" stroke="#6F95C9" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M262 489 H298" fill="none" stroke="#6F95C9" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M166 444 V433 H625 V444" fill="none" stroke="#6F95C9" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M395 535 V557 H165 V579" fill="none" stroke="#6F95C9" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M262 624 H298" fill="none" stroke="#6F95C9" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M836 424 H765 V405 H746" fill="none" stroke="#6F95C9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="68" y="718" width="656" height="66" rx="12" fill="#10372F" stroke="#3AA98B"/><text x="86" y="746" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#96F1D5">Gate determinista</text><text x="86" y="770" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#CDECE2">Evaluación completa • mejora objetivo • cero regresiones • seguridad</text><path d="M395 670 V718" fill="none" stroke="#6F95C9" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M722 490 H732 V751 H724" fill="none" stroke="#6F95C9" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M625 718 V670" fill="none" stroke="#6F95C9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="836" y="515" width="318" height="291" rx="20" fill="#13243B" stroke="#355275"/><text x="857" y="553" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#E8F2FF">Herramientas controladas</text><text x="857" y="600" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#98BEEB">trace_reader</text><text x="857" y="623" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#C4D0E4">Trazas normalizadas</text><text x="857" y="663" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#98BEEB">patch_writer</text><text x="857" y="686" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#C4D0E4">Candidatos versionados</text><text x="857" y="726" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#98BEEB">eval_runner</text><text x="857" y="749" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#C4D0E4">Pruebas reproducibles</text><path d="M746 607 H836" fill="none" stroke="#6F95C9" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1154 554 H1175 V168 H1154" fill="none" stroke="#6F95C9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="46" y="850" width="1108" height="54" rx="12" fill="#13233B" stroke="#2D486D"/><text x="66" y="883" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#D8E8FA">Aceptación / rechazo / revisión humana → reporte trazable • Sin cambios de producción en el MVP</text></svg>

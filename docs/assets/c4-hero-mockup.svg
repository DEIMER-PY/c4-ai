<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" fill="none" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">C4 AI — Autonomous Agent Reliability Engineering</title>
  <desc id="hero-desc">Interactive execution mockup showing the detect, diagnose, patch, evaluate, and deterministic gate loop in crisp vector format.</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b12" />
      <stop offset="50%" stop-color="#0d131f" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="neon-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="win-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#00f0ff" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    <filter id="glow-pill" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Backdrop Glow Mesh -->
  <circle cx="200" cy="150" r="180" fill="#00f0ff" opacity="0.04" filter="blur(60px)" />
  <circle cx="1000" cy="450" r="220" fill="#a855f7" opacity="0.05" filter="blur(70px)" />

  <!-- Main Window Container -->
  <g filter="url(#win-shadow)" transform="translate(40, 30)">
    <!-- Window Base -->
    <rect width="1120" height="580" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5" />

    <!-- Window Title Bar -->
    <rect width="1120" height="48" rx="16" fill="#0b0f19" />
    <path d="M0,48 L1120,48" stroke="#1e293b" stroke-width="1" />

    <!-- macOS Window Traffic Light Controls -->
    <circle cx="28" cy="24" r="6.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
    <circle cx="48" cy="24" r="6.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
    <circle cx="68" cy="24" r="6.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

    <!-- Window Title Text -->
    <text x="560" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="0.5">
      c4-ai — agent-reliability-harness — 1120x580
    </text>

    <!-- Top Status Pills -->
    <g transform="translate(930, 14)">
      <rect x="0" y="0" width="85" height="20" rx="10" fill="#064e3b" stroke="#059669" stroke-width="0.8" />
      <circle cx="10" cy="10" r="3" fill="#34d399" />
      <text x="20" y="14" font-family="monospace" font-size="10" font-weight="700" fill="#a7f3d0">● ONLINE</text>
    </g>
    <g transform="translate(1025, 14)">
      <rect x="0" y="0" width="75" height="20" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8" />
      <text x="10" y="14" font-family="monospace" font-size="10" font-weight="700" fill="#c7d2fe">v0.1.0-prod</text>
    </g>

    <!-- Content Area: Split View -->
    <!-- LEFT PANEL: Real-Time Execution Trace -->
    <g transform="translate(36, 75)">
      <!-- Command Prompt Header -->
      <text x="0" y="20" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" font-weight="700" fill="#38bdf8">$ c4 run --dataset refunds_v2.json --target grok-4.7</text>

      <!-- Step 1: Detect -->
      <g transform="translate(0, 48)">
        <text x="0" y="14" font-family="monospace" font-size="12" font-weight="700" fill="#f43f5e">[!] DETECTED</text>
        <text x="110" y="14" font-family="sans-serif" font-size="13" fill="#cbd5e1">Incident <tspan fill="#f8fafc" font-weight="600">inc_refund_policy_01</tspan> (Boundary window expired)</text>
      </g>

      <!-- Step 2: Diagnose -->
      <g transform="translate(0, 80)">
        <text x="0" y="14" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8">[i] DIAGNOSE</text>
        <text x="110" y="14" font-family="sans-serif" font-size="13" fill="#cbd5e1">Grok-4.7 analyzed execution trace. Causal fault located at line 4.</text>
      </g>

      <!-- Step 3: Patch -->
      <g transform="translate(0, 112)">
        <text x="0" y="14" font-family="monospace" font-size="12" font-weight="700" fill="#a855f7">[+] CANDIDATE</text>
        <text x="110" y="14" font-family="sans-serif" font-size="13" fill="#cbd5e1">Generated atomic prompt patch with store credit fallback.</text>
      </g>

      <!-- Step 4: Evaluate -->
      <g transform="translate(0, 144)">
        <text x="0" y="14" font-family="monospace" font-size="12" font-weight="700" fill="#3b82f6">[~] EVALUATE</text>
        <text x="110" y="14" font-family="sans-serif" font-size="13" fill="#cbd5e1">Running 32 benchmark cases against baseline in parallel...</text>
      </g>

      <!-- Diff Preview Box -->
      <g transform="translate(0, 180)">
        <rect width="520" height="150" rx="10" fill="#090d16" stroke="#1e293b" />
        <!-- Diff Header -->
        <rect width="520" height="28" rx="10" fill="#0f172a" />
        <path d="M0,28 L520,28" stroke="#1e293b" />
        <text x="14" y="18" font-family="monospace" font-size="11" font-weight="700" fill="#64748b">UNIFIED PROMPT DIFF (v1.0.0 → v2.0.0)</text>

        <!-- Diff Lines -->
        <text x="16" y="52" font-family="monospace" font-size="12" fill="#64748b">@@ -1,3 +1,3 @@</text>
        <rect x="8" y="62" width="504" height="22" rx="4" fill="#881337" opacity="0.3" />
        <text x="16" y="78" font-family="monospace" font-size="12" fill="#fda4af">- Validate return requests. Refund if within 30 days.</text>
        <rect x="8" y="88" width="504" height="34" rx="4" fill="#064e3b" opacity="0.3" />
        <text x="16" y="102" font-family="monospace" font-size="12" fill="#6ee7b7">+ Validate return requests. Refund if within 30 days from delivery.</text>
        <text x="16" y="116" font-family="monospace" font-size="12" fill="#6ee7b7">+ If window expired, politely decline and offer store credit.</text>
      </g>

      <!-- Terminal Output Footer -->
      <g transform="translate(0, 350)">
        <text x="0" y="14" font-family="monospace" font-size="12" fill="#94a3b8">SSE Stream: <tspan fill="#00f0ff">connected</tspan> | Cryptographic Signature: <tspan fill="#a855f7">verified</tspan></text>
        <text x="0" y="34" font-family="monospace" font-size="12" fill="#94a3b8">Audit Trail: <tspan fill="#e2e8f0">artifacts/runs/c4_exec_001.json (Merkle Sealed)</tspan></text>
      </g>
    </g>

    <!-- RIGHT PANEL: Deterministic Gate Telemetry & Verdict -->
    <g transform="translate(600, 75)">
      <!-- Main Verdict Banner -->
      <g filter="url(#glow-pill)">
        <rect width="480" height="90" rx="12" fill="#042f2e" stroke="#10b981" stroke-width="2" />
        <circle cx="45" cy="45" r="22" fill="#059669" />
        <!-- Checkmark Icon -->
        <path d="M36,45 L42,51 L55,38" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="80" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="1">GATE VERDICT: ACCEPTED</text>
        <text x="80" y="64" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#a7f3d0">32/32 Passed (100%) • 0 Regressions • Baseline Immutable</text>
      </g>

      <!-- Key Telemetry Metrics Grid -->
      <g transform="translate(0, 110)">
        <!-- Metric 1: Regressions -->
        <g transform="translate(0, 0)">
          <rect width="150" height="74" rx="10" fill="#090d16" stroke="#1e293b" />
          <text x="14" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748b">REGRESSIONS</text>
          <text x="14" y="56" font-family="monospace" font-size="26" font-weight="900" fill="#10b981">0</text>
          <text x="36" y="54" font-family="sans-serif" font-size="11" fill="#64748b">/ 32 cases</text>
        </g>
        <!-- Metric 2: Security Checks -->
        <g transform="translate(165, 0)">
          <rect width="150" height="74" rx="10" fill="#090d16" stroke="#1e293b" />
          <text x="14" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748b">OWASP TOP 10</text>
          <text x="14" y="56" font-family="sans-serif" font-size="22" font-weight="900" fill="#38bdf8">100%</text>
          <text x="80" y="54" font-family="sans-serif" font-size="11" fill="#64748b">pass</text>
        </g>
        <!-- Metric 3: Cost USD -->
        <g transform="translate(330, 0)">
          <rect width="150" height="74" rx="10" fill="#090d16" stroke="#1e293b" />
          <text x="14" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748b">COST PER TASK</text>
          <text x="14" y="56" font-family="monospace" font-size="18" font-weight="900" fill="#facc15">$0.0728</text>
        </g>
      </g>

      <!-- Multi-Model Performance Table Card -->
      <g transform="translate(0, 202)">
        <rect width="480" height="185" rx="12" fill="#090d16" stroke="#1e293b" />
        <rect width="480" height="30" rx="12" fill="#0f172a" />
        <path d="M0,30 L480,30" stroke="#1e293b" />
        <text x="16" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8">MULTI-MODEL SCALE BENCHMARK (S4 1,000 UNITS)</text>

        <!-- Column Headers -->
        <text x="16" y="50" font-family="monospace" font-size="11" font-weight="700" fill="#64748b">PROVIDER</text>
        <text x="160" y="50" font-family="monospace" font-size="11" font-weight="700" fill="#64748b">THROUGHPUT</text>
        <text x="290" y="50" font-family="monospace" font-size="11" font-weight="700" fill="#64748b">LATENCY p50</text>
        <text x="400" y="50" font-family="monospace" font-size="11" font-weight="700" fill="#64748b">STATUS</text>

        <!-- Row 1: xAI Grok -->
        <text x="16" y="78" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc">xAI Grok-4.7</text>
        <text x="160" y="78" font-family="monospace" font-size="12" fill="#38bdf8">32.5 u/s</text>
        <text x="290" y="78" font-family="monospace" font-size="12" fill="#e2e8f0">1,240 ms</text>
        <text x="400" y="78" font-family="sans-serif" font-size="11" font-weight="700" fill="#10b981">● ACTIVE</text>

        <!-- Row 2: Groq Llama 3.3 -->
        <text x="16" y="106" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Groq Llama-3.3</text>
        <text x="160" y="106" font-family="monospace" font-size="12" fill="#38bdf8">48.2 u/s</text>
        <text x="290" y="106" font-family="monospace" font-size="12" fill="#e2e8f0">625 ms</text>
        <text x="400" y="106" font-family="sans-serif" font-size="11" font-weight="700" fill="#10b981">● ACTIVE</text>

        <!-- Row 3: DeepSeek Chat -->
        <text x="16" y="134" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc">DeepSeek-Chat</text>
        <text x="160" y="134" font-family="monospace" font-size="12" fill="#38bdf8">28.9 u/s</text>
        <text x="290" y="134" font-family="monospace" font-size="12" fill="#e2e8f0">1,410 ms</text>
        <text x="400" y="134" font-family="sans-serif" font-size="11" font-weight="700" fill="#10b981">● ACTIVE</text>

        <!-- Row 4: Ollama Local -->
        <text x="16" y="162" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Ollama (Local GPU)</text>
        <text x="160" y="162" font-family="monospace" font-size="12" fill="#38bdf8">12.1 u/s</text>
        <text x="290" y="162" font-family="monospace" font-size="12" fill="#e2e8f0">452 ms</text>
        <text x="400" y="162" font-family="sans-serif" font-size="11" font-weight="700" fill="#a855f7">● $0.00 USD</text>
      </g>
    </g>
  </g>
</svg>
